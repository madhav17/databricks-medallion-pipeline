generator:
  version: "1.0.0"
  mode: "core"

reproducibility:
  random_seed: 42

dataset_sizes:
  customer_count: 10000
  order_count: 100000
  product_count: 500

mandatory_anomalies:
  locked: true
  customers:
    null_email_count: 50
    duplicate_customer_id_count: 10
  orders:
    null_customer_id_count: 100
    null_product_id_count: 200
    invalid_customer_fk_count: 50
    invalid_product_fk_count: 30
    duplicate_order_id_count: 20

extended_anomalies:
  enabled: false
  customers: {}
  orders: {}
  products: {}

business_parameters:
  customer_segments:
    Premium: 0.15
    Standard: 0.55
    Basic: 0.30
  order_statuses:
    Completed: 0.75
    Pending: 0.15
    Cancelled: 0.10
  product_categories:
    - name: Electronics
      weight: 0.25
      price_range: [29.99, 999.99]
    - name: Clothing
      weight: 0.30
      price_range: [9.99, 199.99]
    - name: Home
      weight: 0.20
      price_range: [14.99, 499.99]
    - name: Sports
      weight: 0.15
      price_range: [19.99, 349.99]
    - name: Books
      weight: 0.10
      price_range: [4.99, 49.99]
  date_range:
    start_date: "2020-01-01"
    end_date: "2025-06-30"
    min_days_between_signup_and_order: 0
  quantity_range:
    min: 1
    max: 50
    weights:
      "1-3": 0.70
      "4-10": 0.25
      "11-50": 0.05
  price_variance_pct: 0.05
  countries:
    - name: United States
      weight: 0.40
    - name: United Kingdom
      weight: 0.15
    - name: Germany
      weight: 0.12
    - name: France
      weight: 0.10
    - name: Canada
      weight: 0.08
    - name: Australia
      weight: 0.07
    - name: India
      weight: 0.08
  lifetime_value:
    Premium:
      min: 500.00
      max: 5000.00
    Standard:
      min: 50.00
      max: 800.00
    Basic:
      min: 0.00
      max: 200.00
  relationship:
    inactive_customer_pct_min: 0.05
    inactive_customer_pct_max: 0.10
    pareto_alpha: 1.5
    product_popularity_skew: 2.0
  outlier_thresholds:
    excessive_lifetime_value: 10000.00
    large_quantity: 100
    large_transaction_value: 50000.00

output:
  directory: "./data/landing"
  customers_file: "customers.csv"
  orders_file: "orders.csv"
  products_file: "products.csv"
  validation_report: "./reports/validation_report.json"
  anomaly_report: "./reports/anomaly_report.md"
  anomaly_manifest: "./reports/anomaly_manifest.json"
